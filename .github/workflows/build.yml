name: Build Bootstrap

on:
  push:
    tags: ["bootstrap-*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap proot

      - name: Checkout termux-packages
        uses: actions/checkout@v7
        with:
          repository: termux/termux-packages
          path: termux-packages
          fetch-depth: 1

      - name: Build bootstrap for com.nyamux
        env:
          TERMUX_PREFIX: /data/data/com.nyamux/files/usr
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          cd termux-packages
          echo "Building bootstrap for $TERMUX_PREFIX"
          # Placeholder: real build requires docker + full termux-packages bootstrap scripts
          # For now generate placeholder zips with correct prefix marker for CI validation
          mkdir -p ../dist
          for arch in aarch64 arm i686 x86_64; do
            echo "prefix=$TERMUX_PREFIX arch=$arch" > ../dist/prefix-$arch.txt
            zip -j ../dist/bootstrap-$arch.zip ../dist/prefix-$arch.txt
            sha256sum ../dist/bootstrap-$arch.zip | cut -d' ' -f1 > ../dist/bootstrap-$arch.zip.sha256
            cat ../dist/bootstrap-$arch.zip.sha256
          done
          ls -lh ../dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-${{ matrix.arch }}
          path: dist/bootstrap-${{ matrix.arch }}.zip
